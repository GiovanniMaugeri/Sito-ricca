<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Apri in Wimii</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/common.css">

    <!-- Preview per WhatsApp, iMessage, Telegram, Facebook, Twitter, ecc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Wimii">
    <meta property="og:title" content="Wimii">
    <meta property="og:description" content="Apri Wimii per accettare un invito o scoprire l'iniziativa, lo sconto o l'evento condiviso.">
    <meta property="og:image" content="https://wimii.app/assets/logo.png">
    <meta property="og:image:alt" content="Wimii">
    <meta property="og:url" content="https://wimii.app">
    <meta property="og:locale" content="it_IT">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wimii">
    <meta name="twitter:description" content="Apri Wimii per accettare un invito o scoprire l'iniziativa, lo sconto o l'evento condiviso.">
    <meta name="twitter:image" content="https://wimii.app/assets/logo.png">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #F7F7FA;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8ch 2ch 4ch 2ch;
        }
        #main-logo {
            width: 96px;
            height: 96px;
            margin-bottom: 3ch;
            border-radius: 22%;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.25);
        }
        h1.title {
            font-size: 1.8rem;
            color: #2D2D2D;
            margin-bottom: 1.5ch;
        }
        p.subtitle {
            font-size: 1rem;
            color: #555;
            max-width: 420px;
            margin-bottom: 2ch;
            line-height: 1.5;
        }
        p.note {
            font-size: 0.9rem;
            color: #777;
            max-width: 420px;
            margin-bottom: 4ch;
            line-height: 1.45;
        }
        .code-pill {
            display: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #2D2D2D;
            background: #fff;
            border: 1px solid #E0E0E0;
            border-radius: 10px;
            padding: 0.7ch 1.4ch;
            margin-bottom: 2.5ch;
        }
        .code-pill.visible {
            display: inline-block;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1.2ch;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1ch;
            padding: 1.2ch 2ch;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: #FF6B6B;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(255, 107, 107, 0.45);
        }
        .btn-store {
            background: white;
            color: #2D2D2D;
            border: 1px solid #E0E0E0;
        }
        .btn-store:hover {
            background: #FAFAFA;
        }
        .btn .icon {
            width: 20px;
            height: 20px;
            margin: 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <main>
        <img id="main-logo" src="/assets/logo.png" alt="Wimii">
        <h1 class="title" id="pageTitle">Apri in Wimii</h1>
        <p class="subtitle" id="pageSubtitle">
            Qualcuno ha condiviso con te un'iniziativa. Aprila nell'app Wimii per dare un'occhiata!
        </p>
        <div class="code-pill" id="codePill" aria-label="Codice invito"></div>
        <p class="note hidden" id="pageNote"></p>

        <div class="btn-group">
            <a id="openAppBtn" href="#" class="btn btn-primary">
                Apri nell'app
            </a>
            <a id="iosBtn" href="https://apps.apple.com/it/app/id6758889696" class="btn btn-store">
                <img class="icon" src="/assets/apple.png" alt="">
                Scarica su App Store
            </a>
            <a id="androidBtn" href="https://play.google.com/store/apps/details?id=com.wimii.app" class="btn btn-store">
                <img class="icon" src="/assets/PlayStoreIcon.png" alt="">
                Scarica su Google Play
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; Wimii. All rights reserved.</p>
    </footer>

    <script>
        (function() {
            var path = window.location.pathname || '';
            var shareMatch = path.match(/^\/(i|s|e)\/([^\/?#]+)/);
            var inviteMatch = path.match(/^\/r\/([^\/?#]+)/);
            var isInvite = !!inviteMatch;
            var isSharedCard = !!shareMatch;

            var ua = navigator.userAgent || '';
            var isIOS = /iPhone|iPad|iPod/i.test(ua);
            var isAndroid = /Android/i.test(ua);

            var titleEl = document.getElementById('pageTitle');
            var subtitleEl = document.getElementById('pageSubtitle');
            var noteEl = document.getElementById('pageNote');
            var codePill = document.getElementById('codePill');
            var openAppBtn = document.getElementById('openAppBtn');
            var iosBtn = document.getElementById('iosBtn');
            var androidBtn = document.getElementById('androidBtn');

            if (!isInvite && !isSharedCard) {
                titleEl.textContent = 'Pagina non trovata';
                subtitleEl.textContent = 'Ti stiamo riportando alla home...';
                openAppBtn.classList.add('hidden');
                setTimeout(function() {
                    window.location.replace('/');
                }, 1200);
                return;
            }

            var type;
            var id;
            var deepLink;
            var httpsLink = window.location.origin + window.location.pathname;

            if (isInvite) {
                type = 'r';
                id = decodeURIComponent(inviteMatch[1]);
                deepLink = 'wimii://r/' + encodeURIComponent(id);

                titleEl.textContent = 'Ti hanno invitato su Wimii';
                subtitleEl.textContent = 'Apri l\'app per accettare l\'invito, oppure scaricala e completa la registrazione.';
                noteEl.textContent = 'Dopo l\'installazione riapri questo link: l\'invito resterà collegato al tuo account.';
                noteEl.classList.remove('hidden');
                codePill.textContent = id;
                codePill.classList.add('visible');

                try {
                    localStorage.setItem('wimii_pending_invite', id);
                    localStorage.setItem('wimii_pending_invite_url', httpsLink);
                    localStorage.setItem('wimii_pending_invite_at', String(Date.now()));
                } catch (e) {}

                // Play Install Referrer: l'app può leggere invite=<code> al primo avvio
                androidBtn.href = 'https://play.google.com/store/apps/details?id=com.wimii.app&referrer=' +
                    encodeURIComponent('invite=' + id + '&utm_source=wimii_invite&utm_content=' + id);
            } else {
                type = shareMatch[1];
                id = shareMatch[2];
                deepLink = 'wimii://' + type + '/' + id;
            }

            openAppBtn.href = deepLink;

            if (isIOS) {
                androidBtn.classList.add('hidden');
            } else if (isAndroid) {
                iosBtn.classList.add('hidden');
            }

            // Universal / App Links aprono l'app se installata; qui fallback custom scheme
            if (isIOS || isAndroid) {
                setTimeout(function() {
                    window.location.href = deepLink;
                }, 100);
            }
        })();
    </script>
</body>
</html>
