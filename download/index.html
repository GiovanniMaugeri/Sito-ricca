<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Scarica Wimii — App Store e Google Play</title>
    <meta name="description" content="Scarica Wimii su App Store o Google Play. Iniziative vere, persone vere, a uno swipe da te.">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/download.css">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Wimii">
    <meta property="og:title" content="Scarica Wimii">
    <meta property="og:description" content="Iniziative vere, persone vere, a uno swipe da te. Scarica l'app su App Store o Google Play.">
    <meta property="og:image" content="https://wimii.app/assets/logo.png">
    <meta property="og:image:alt" content="Wimii">
    <meta property="og:url" content="https://wimii.app/download">
    <meta property="og:locale" content="it_IT">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Scarica Wimii">
    <meta name="twitter:description" content="Iniziative vere, persone vere, a uno swipe da te. Scarica l'app su App Store o Google Play.">
    <meta name="twitter:image" content="https://wimii.app/assets/logo.png">
    <meta name="apple-itunes-app" content="app-id=6758889696">
</head>
<body class="page-download">
    <div class="download-bg" aria-hidden="true"></div>
    <div class="download-grain" aria-hidden="true"></div>

    <header class="download-header">
        <a class="logo" href="/">
            <img src="/assets/logo.png" alt="Wimii" id="logo">
            <h1>Wimii</h1>
        </a>
        <a class="site-link" href="/">Vai al sito</a>
    </header>

    <main class="download-main">
        <div class="download-copy">
            <img class="download-logo" src="/assets/logo.png" alt="Wimii">
            <p class="download-brand">Wimii</p>
            <h2 class="download-title">Scarica l’app</h2>
            <p class="download-sub">Iniziative vere, persone vere, a uno swipe da te.</p>

            <div class="download-cta" id="storeButtons">
                <a
                    id="iosBtn"
                    class="btn-store btn-store-primary"
                    href="https://apps.apple.com/it/app/id6758889696"
                    rel="noopener"
                >
                    <img class="icon" src="/assets/apple.png" alt="">
                    App Store
                </a>
                <a
                    id="androidBtn"
                    class="btn-store btn-store-secondary"
                    href="https://play.google.com/store/apps/details?id=com.wimii.app"
                    rel="noopener"
                >
                    <img class="icon" src="/assets/PlayStoreIcon.png" alt="">
                    Google Play
                </a>
            </div>

            <p class="download-hint" id="downloadHint">
                Tocca il pulsante del tuo store per scaricare.
            </p>
            <p class="download-hint download-escape" id="escapeHint" hidden>
                Se non si apre: tocca <strong>⋯</strong> in basso a destra → <strong>Apri nel browser esterno</strong>, poi di nuovo App Store.
            </p>
        </div>
    </main>

    <footer class="download-footer">
        <p>&copy; Wimii. All rights reserved.</p>
    </footer>

    <script>
        (function () {
            var APP_STORE_HTTPS = 'https://apps.apple.com/it/app/id6758889696';
            // Schema nativo: nel browser di Instagram/Facebook https://apps.apple.com spesso non fa nulla.
            var APP_STORE_ITMS = 'itms-apps://apps.apple.com/it/app/id6758889696';
            var PLAY_HTTPS = 'https://play.google.com/store/apps/details?id=com.wimii.app';
            var PLAY_MARKET = 'market://details?id=com.wimii.app';

            var ua = navigator.userAgent || '';
            var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/i.test(ua);
            var isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\//i.test(ua);

            var wrap = document.getElementById('storeButtons');
            var iosBtn = document.getElementById('iosBtn');
            var androidBtn = document.getElementById('androidBtn');
            var hint = document.getElementById('downloadHint');
            var escapeHint = document.getElementById('escapeHint');

            if (!wrap || !iosBtn || !androidBtn) return;

            // Metti lo store del dispositivo per primo e in evidenza.
            if (isAndroid) {
                wrap.insertBefore(androidBtn, iosBtn);
                androidBtn.className = 'btn-store btn-store-primary';
                iosBtn.className = 'btn-store btn-store-secondary';
                if (hint) hint.textContent = 'Tocca Google Play per installare Wimii.';
            } else if (isIOS) {
                wrap.insertBefore(iosBtn, androidBtn);
                iosBtn.className = 'btn-store btn-store-primary';
                androidBtn.className = 'btn-store btn-store-secondary';
                if (hint) hint.textContent = 'Tocca App Store per installare Wimii.';
            }

            if (isInAppBrowser && escapeHint) {
                escapeHint.hidden = false;
            }

            // Instagram/Facebook: niente target=_blank (spesso blocca). Usa schema store nativo.
            if (isIOS) {
                iosBtn.href = isInAppBrowser ? APP_STORE_ITMS : APP_STORE_HTTPS;
                iosBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = APP_STORE_ITMS;
                    setTimeout(function () {
                        // Fallback se lo schema nativo non viene gestito
                        window.location.href = APP_STORE_HTTPS;
                    }, 500);
                });
            }

            if (isAndroid) {
                androidBtn.href = isInAppBrowser ? PLAY_MARKET : PLAY_HTTPS;
                androidBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = PLAY_MARKET;
                    setTimeout(function () {
                        window.location.href = PLAY_HTTPS;
                    }, 500);
                });
            }
        })();
    </script>
</body>
</html>
